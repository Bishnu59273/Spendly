<html lang="en">

    <link rel="canonical" href="https://spendly.it.com/" />

    <meta property="og:site_name" content="Spendly" />
    <meta property="og:title" content="Spendly — Personal Expense Tracker &amp; Budget Manager" />

    <meta name="twitter:image" content="https://spendly.it.com/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Spendly",
      "url": "https://spendly.it.com",
      "description": "Personal expense tracker and budget manager. Track spending by salary cycle, set savings goals, and visualize where your money goes.",

      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Salary cycle budgeting",
        "Expense tracking",
        "Savings goals",
        "Custom categories and tags",
        "Multi-currency support",
        "Progressive Web App (PWA)",
        "Dark mode",
        "Visual charts and insights"
      ],
      "screenshot": "https://spendly.it.com/og-image.png"
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaPrompt = e;
      });
